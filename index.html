<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Prueba de cámara</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b1020;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 700px;
      padding: 24px;
      text-align: center;
    }

    h1 {
      font-size: 36px;
      margin: 0 0 10px;
    }

    p {
      color: #aeb6c8;
      font-size: 17px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    button {
      width: 100%;
      min-height: 70px;
      border: 0;
      border-radius: 18px;
      background: white;
      color: #0b1020;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
    }

    video {
      display: none;
      width: 100%;
      height: 65vh;
      margin-top: 22px;
      border-radius: 22px;
      background: black;
      object-fit: cover;
    }

    #estado {
      margin-top: 18px;
      font-size: 16px;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <main class="app">

    <h1>📷 Prueba de cámara</h1>

    <p>
      Vamos a comprobar que este dispositivo puede utilizar
      la cámara desde nuestra aplicación.
    </p>

    <button id="boton" onclick="abrirCamara()">
      ABRIR CÁMARA
    </button>

    <div id="estado"></div>

    <video
      id="video"
      autoplay
      muted
      playsinline>
    </video>

  </main>


  <script>

    async function abrirCamara() {

      const estado = document.getElementById('estado');
      const video = document.getElementById('video');
      const boton = document.getElementById('boton');

      estado.textContent = 'Solicitando acceso a la cámara...';

      try {

        const stream =
          await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: {
                ideal: 'environment'
              }
            }
          });

        video.srcObject = stream;

        await video.play();

        video.style.display = 'block';

        boton.style.display = 'none';

        estado.textContent = '✅ CÁMARA FUNCIONANDO';

      }

      catch (error) {

        console.error(error);

        estado.textContent =
          '❌ No se pudo abrir la cámara: ' +
          error.name;

      }

    }

  </script>

</body>
</html>
